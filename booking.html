<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Peminjaman</title>
</head>
<body>
  <h1>Form Pengajuan Peminjaman</h1>
  <form>
    <label>Nama Mahasiswa</label>
    <input type="text" placeholder="Masukkan nama">
    <br><br>
    <label>Nama Ruang</label>
    <select>
      <option>Ruang 101</option>
      <option>Ruang 202</option>
      <option>Laboratorium 1</option>
    </select>
    <br><br>
    <label>Tanggal Peminjaman</label>
    <input type="date">
    <br><br>
    <button type="button">Ajukan Peminjaman</button>
  </form>
</body>
</html>
